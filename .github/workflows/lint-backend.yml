name: Lint Backend

on:
  push:
  pull_request:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Checkstyle
        run: curl -L https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.1/checkstyle-10.12.1-all.jar -o checkstyle.jar

      - name: Run Checkstyle
        run: java -jar checkstyle.jar -c /google_checks.xml src/main/java/com/smartcare/clinic || true